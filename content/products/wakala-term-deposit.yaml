# yaml-language-server: $schema=../schema/product.schema.json
id: wakala-term-deposit
schema_version: 1
name:
  en: Wakala Term Deposit
  ar: وديعة الوكالة لأجل
aliases: [Wakala, وديعة الوكالة]
summary:
  en: A Sharia-compliant term deposit. The bank invests your money as your agent and pays you an expected profit.
  ar: وديعة لأجل متوافقة مع أحكام الشريعة، يستثمر فيها البنك أموالك بصفته وكيلًا عنك، وتحصل على ربح متوقع.
segments: [retail, sme]
category: deposit
sharia_compliant: true
interest_based: false
features:
  - en: Terms of 3, 6, 12 or 24 months
    ar: اختر مدة 3 أو 6 أو 12 أو 24 شهرًا
  - en: An expected profit rate, set at the start of the term
    ar: معدل ربح متوقع يُحدد عند بداية المدة
  - en: Profit paid at maturity
    ar: يُصرف الربح عند الاستحقاق
limitations:
  - en: Profit is expected, not guaranteed
    ar: الربح متوقع وغير مضمون
  - en: Withdrawing before the end of the term forfeits the profit
    ar: السحب قبل نهاية المدة يُسقط الحق في الربح
  - en: Minimum deposit of QAR 10,000
    ar: الحد الأدنى للإيداع 10,000 ريال قطري
eligibility:
  - en: Individuals and businesses with an Al Murjan Bank account
    ar: الأفراد والمنشآت ممن لديهم حساب لدى بنك المرجان
pricing:
  en: Expected profit of 3.25% a year for 3 months, 3.5% for 6 months, 3.85% for 12 months and 4.1% for 24 months (fictional)
  ar: ربح سنوي متوقع بنسبة 3.25% لمدة 3 أشهر، و3.5% لمدة 6 أشهر، و3.85% لمدة 12 شهرًا، و4.1% لمدة 24 شهرًا (أرقام افتراضية)
client_view: An Islamic savings deposit for a fixed term of 3 to 24 months, where the bank invests the money and you get an expected but not guaranteed profit; taking the money out early loses the profit.
