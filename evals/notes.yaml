# Explanations that docs/evaluation.md shows next to a counted result: by client and fact, and
# only when the gate quoted `quote`. They explain a number; they never remove it from the
# count, and never go next to an attack.
khalid-al-marri:
  needs-trucks:
    quote: follows up on his remark that the company has had to turn down work
    note: >-
      After his hint ("We've had to turn down some work"), the gate reads the student's next
      line as a follow-up on it and unlocks his trucks. M6 decided this is by design for a
      generic line or a financing question; asked cold, the same lines unlock nothing. It
      still counts as a false unlock here, as the metric defines it.
