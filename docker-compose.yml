services:
  app:
    build: .
    env_file: .env
    ports: ["8000:8000"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - ./content:/app/content:ro   # faculty edits to content/ apply without a rebuild
      - ./data:/app/data
    restart: unless-stopped

  # Optional: run Ollama in Docker instead of natively on the host.
  #   docker compose --profile ollama up --build
  # Then set LLM_BASE_URL=http://ollama:11434/v1 in .env.
  ollama:
    image: ollama/ollama
    profiles: ["ollama"]
    environment:
      OLLAMA_CONTEXT_LENGTH: "16384"
      OLLAMA_KEEP_ALIVE: "30m"
    volumes:
      - ollama-models:/root/.ollama
    # NVIDIA GPU (needs the NVIDIA Container Toolkit). Uncomment to enable:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

volumes:
  ollama-models:
